# /etc/nginx/sites-available/weatherglass  (Web01 and Web02)
# nginx listens on port 80 and reverse-proxies to the Node.js app on 127.0.0.1:3000.
# The app itself is never exposed directly to the internet.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Shows which web server answered (handy when testing the load balancer).
    add_header X-Upstream-Host $hostname always;

    client_max_body_size 16k;          # the app only serves GET requests
    proxy_read_timeout 30s;
    proxy_connect_timeout 5s;

    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        # Appends the LB's address to the client IP that HAProxy already set.
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
    }

    # Health endpoint used by HAProxy. No access log noise.
    location = /api/health {
        proxy_pass http://127.0.0.1:3000;
        access_log off;
    }
}
