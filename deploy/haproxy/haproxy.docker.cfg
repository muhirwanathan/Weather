# HAProxy config for docker-compose (same logic as haproxy.cfg, container hostnames).
defaults
    mode http
    option forwardfor
    option http-server-close
    option redispatch
    retries 2
    timeout connect 5s
    timeout client  30s
    timeout server  30s

frontend http_in
    bind *:80
    http-response set-header X-Load-Balancer lb-01
    default_backend app

backend app
    balance roundrobin
    option httpchk GET /api/health HTTP/1.1\r\nHost:\ localhost
    http-check expect status 200
    default-server inter 3s fall 2 rise 2
    server web-01 web-01:3000 check
    server web-02 web-02:3000 check
