# /etc/haproxy/haproxy.cfg  (load balancer)
# Round-robin load balancing between web-01 and web-02 with active health checks.
# WEB01_ADDR / WEB02_ADDR are replaced by deploy/setup-lb.sh with host:port values.
# Syntax is compatible with HAProxy 2.0 (Ubuntu 20.04) and newer.

global
    log /dev/log local0
    log /dev/log local1 notice
    chroot /var/lib/haproxy
    stats socket /run/haproxy/admin.sock mode 660 level admin
    user haproxy
    group haproxy
    daemon

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    option  forwardfor              # adds X-Forwarded-For so the app sees the real client IP
    option  http-server-close
    timeout connect 5s
    timeout client  30s
    timeout server  30s
    retries 2
    option  redispatch              # retry a failed request on the other server

frontend weatherglass_http
    bind *:80
    http-response set-header X-Load-Balancer lb-01
    default_backend weatherglass_servers

backend weatherglass_servers
    balance roundrobin
    option httpchk GET /api/health HTTP/1.1\r\nHost:\ localhost
    http-check expect status 200
    # inter: check every 3 s; fall 2: mark down after 2 failures; rise 2: back up after 2 passes
    default-server inter 3s fall 2 rise 2
    server web-01 WEB01_ADDR check
    server web-02 WEB02_ADDR check
